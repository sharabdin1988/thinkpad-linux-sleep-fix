# Конфигурация Thinkfan для ThinkPad с процессором AMD и встроенной графикой
# Оптимизировано для предотвращения троттлинга в играх

sensors:
  - hwmon: /sys/class/hwmon
    name: thinkpad
    indices: [1] # Основной датчик системы (температура корпуса/платы)

  - hwmon: /sys/class/hwmon
    name: k10temp
    indices: [1] # Температура вычислительных ядер процессора (Tctl)

  - hwmon: /sys/class/hwmon
    name: amdgpu
    indices: [1] # Температура встроенной видеокарты (важно для игр)

# Устройство управления вентилятором
fans:
  - tpacpi: /proc/acpi/ibm/fan

# Настройка оборотов: [УРОВЕНЬ, ТЕМП_ВКЛ, ТЕМП_ВЫКЛ]
# Температура берется по самому горячему из датчиков выше.
levels:
  - [0,  0,  55]  # ТИШИНА И ЭКОНОМИЯ: Вентилятор стоит до 55°C. Идеально для офисной работы.
  - [1, 52,  60]  # Едва слышный обдув.
  - [2, 57,  65]  
  - [3, 62,  70]  # Начинаем активнее охлаждать, когда пошла нагрузка.
  - [4, 65,  75]
  - [5, 68,  80]  # Высокие обороты для тяжелых программ.
  - [7, 72,  82]  # Максимальный стандартный уровень.
  
  # РЕЖИМ ДЛЯ ИГР:
  # Вместо "auto" включаем "full-speed" (сверх-обороты) на 78°C.
  # Это позволит вентилятору крутиться на максимум возможностей (около 5000+ RPM),
  # предотвращая достижение критических 90-95°C, при которых начинается троттлинг.
  - ["level full-speed", 78, 32767]
